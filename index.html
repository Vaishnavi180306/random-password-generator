<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="style.css">
     <script src="script.js" defer></script>
</head>
<body>

    <div class="container">
        <h2>Password Generator</h2>

        <!-- Password length -->
        <label>Select Password Length</label>
        <input type="number" id="length" min="4" max="20" value="8">

        <!-- Options -->
        <div class="options">
            <label><input type="checkbox" id="upper"> Include Uppercase</label>
            <label><input type="checkbox" id="lower"> Include Lowercase</label>
            <label><input type="checkbox" id="number"> Include Numbers</label>
            <label><input type="checkbox" id="symbol"> Include Special Characters</label>
        </div>

        <!-- Generate button -->
        <button onclick="generatePassword()">Generate Password</button>

          <!-- Password output -->
        <input type="text" id="password" placeholder="Your password will appear here" readonly>
        
    </div>
</body>
</html>
